<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bdb'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='white'/%3E%3C/svg%3E">
<style>
/* ===== Design tokens: dark-first, ONE vivid accent (violet) with a gradient + glow, glass surfaces. Everything below uses these variables. ===== */
:root{
  --bg:#07070b; --surface:#0f0f17; --surface-2:#181824; --glass:rgba(22,22,34,.62); --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.17);
  --text:#f5f5fb; --muted:#a4a4bb; --faint:#70708a;
  --accent:#9a82ff; --accent-hover:#b09bff; --accent-soft:rgba(139,109,255,.16); --on-accent:#ffffff;
  --grad:linear-gradient(135deg,#7a55fa 0%,#a24cf0 100%); --glow:0 8px 32px -6px rgba(139,92,255,.55);
  --ok:#3fdc9a; --ok-soft:rgba(63,220,154,.13); --bad:#ff7070; --bad-soft:rgba(255,112,112,.14); --warn:#ffc857; --warn-soft:rgba(255,200,87,.13);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 28px -10px rgba(0,0,0,.7); --shadow-lg:0 24px 64px -16px rgba(0,0,0,.8);
  --aurora:radial-gradient(900px 480px at 85% -8%,rgba(122,85,250,.26),transparent 62%),radial-gradient(700px 420px at 5% 12%,rgba(224,82,160,.12),transparent 60%);
  --r-sm:10px; --r:16px; --r-lg:24px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --font:Inter,Heebo,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --display:Rubik,Inter,Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --nav-h:66px; --top-h:58px; --tap:46px; --maxw:760px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f5f4fb; --surface:#ffffff; --surface-2:#efeef8; --glass:rgba(255,255,255,.78); --border:rgba(30,30,70,.09); --border-strong:rgba(30,30,70,.2);
  --text:#14141f; --muted:#585870; --faint:#8b8ba3;
  --accent:#5b3fe0; --accent-hover:#4a31c4; --accent-soft:rgba(91,63,224,.09);
  --glow:0 8px 28px -8px rgba(110,70,240,.5);
  --ok:#0c7a55; --ok-soft:rgba(12,122,85,.1); --bad:#c0302a; --bad-soft:rgba(192,48,42,.09); --warn:#8f5f00; --warn-soft:rgba(143,95,0,.11);
  --shadow:0 1px 2px rgba(30,30,70,.06),0 8px 24px -10px rgba(30,30,70,.14); --shadow-lg:0 20px 50px -16px rgba(40,30,100,.28);
  --aurora:radial-gradient(900px 480px at 85% -8%,rgba(122,85,250,.15),transparent 62%),radial-gradient(700px 420px at 5% 12%,rgba(224,82,160,.08),transparent 60%);
}}
:root[data-theme="light"]{
  --bg:#f5f4fb; --surface:#ffffff; --surface-2:#efeef8; --glass:rgba(255,255,255,.78); --border:rgba(30,30,70,.09); --border-strong:rgba(30,30,70,.2);
  --text:#14141f; --muted:#585870; --faint:#8b8ba3;
  --accent:#5b3fe0; --accent-hover:#4a31c4; --accent-soft:rgba(91,63,224,.09);
  --glow:0 8px 28px -8px rgba(110,70,240,.5);
  --ok:#0c7a55; --ok-soft:rgba(12,122,85,.1); --bad:#c0302a; --bad-soft:rgba(192,48,42,.09); --warn:#8f5f00; --warn-soft:rgba(143,95,0,.11);
  --shadow:0 1px 2px rgba(30,30,70,.06),0 8px 24px -10px rgba(30,30,70,.14); --shadow-lg:0 20px 50px -16px rgba(40,30,100,.28);
  --aurora:radial-gradient(900px 480px at 85% -8%,rgba(122,85,250,.15),transparent 62%),radial-gradient(700px 420px at 5% 12%,rgba(224,82,160,.08),transparent 60%);
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background-color:var(--bg);background-image:var(--aurora);background-attachment:fixed;background-repeat:no-repeat;color:var(--text);font:16px/1.55 var(--font);-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh}
h1,h2,h3,p{margin:0}
h1,h2,h3,.display,.brand{font-family:var(--display)}
h1{font-size:1.6rem;line-height:1.2;font-weight:700;letter-spacing:-.015em}
h2{font-size:1.15rem;line-height:1.3;font-weight:600}
.display{font-size:clamp(1.75rem,5.4vw,2.35rem);line-height:1.12;font-weight:700;letter-spacing:-.025em}
.gradtxt{background:linear-gradient(100deg,#a78bff,#e879c6 70%,#ffa56b);-webkit-background-clip:text;background-clip:text;color:transparent}
h3{font-size:1rem;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
bdi,.ltr{unicode-bidi:isolate}
.ltr{direction:ltr;display:inline-block}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:var(--r-sm);z-index:100;text-decoration:none}
.skip:focus{top:8px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.ic{display:inline-flex;width:1.25em;height:1.25em;flex:none;vertical-align:middle}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== Buttons, chips, inputs ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.14);font-weight:650;text-decoration:none;background:var(--grad);color:#fff;box-shadow:var(--glow),0 1px 0 rgba(255,255,255,.25) inset;transition:filter .15s,transform .12s,box-shadow .15s,background .15s;white-space:nowrap;user-select:none}
.btn:hover{filter:brightness(1.12);box-shadow:0 10px 36px -6px rgba(139,92,255,.7),0 1px 0 rgba(255,255,255,.25) inset}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn.secondary{background:var(--glass);color:var(--text);border-color:var(--border-strong);box-shadow:none;backdrop-filter:blur(10px)}
.btn.secondary:hover{background:var(--surface-2);filter:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent);padding:0 var(--s3);box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft);filter:none;box-shadow:none}

.btn.lg{min-height:54px;padding:0 var(--s5);font-size:1.05rem}
.btn.sm{min-height:36px;padding:0 var(--s3);font-size:.875rem}
.btn.block{width:100%}
.btn.secondary.block.bulk{min-height:40px;font-size:.9rem}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:transparent;color:var(--text);position:relative}
.iconbtn:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted);font-size:.8125rem;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
button.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--text);min-height:40px;padding:4px 14px;font-size:.9rem;font-weight:550;white-space:normal;text-align:start}
button.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:.875rem;font-weight:650;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:var(--tap);padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text)}
.input::placeholder{color:var(--faint)}
.input:focus-visible{outline:3px solid var(--accent-soft);border-color:var(--accent);outline-offset:0}
.input[aria-invalid="true"]{border-color:var(--bad)}
.pwrap{position:relative;direction:ltr}
.pwrap .iconbtn{position:absolute;right:2px;top:0;height:100%;width:var(--tap);color:var(--muted)}
.pwrap .input{padding-right:48px;text-align:left}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:38px;padding:0 16px;border-radius:var(--r-pill);font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-inline-end-color:transparent;animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.enter>*{animation:rise .35s ease both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}

/* ===== Cards & layout ===== */
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:var(--s4);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.card.flat{box-shadow:none}
.card.pad-lg{padding:var(--s5)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.stack.tight{gap:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s3)}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.page-head{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s5)}
.page-head p{color:var(--muted)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s5) 0 var(--s3)}
.sec-title h2{font-size:1.05rem}
.divider{height:1px;background:var(--border);margin:var(--s3) 0;border:0}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--border);min-height:56px}
.list>.li:first-child{border-top:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:750;flex:none;text-transform:uppercase}
.bar{height:8px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);box-shadow:0 0 12px rgba(139,92,255,.6);border-radius:inherit;transition:width .6s ease}
.bar.ok>i{background:var(--ok)}
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r-sm);background:var(--accent-soft);color:var(--text);font-size:.9375rem}
.notice .ic{color:var(--accent);margin-top:2px}
.notice.warn{background:var(--warn-soft)}.notice.warn .ic{color:var(--warn)}
.notice.bad{background:var(--bad-soft)}.notice.bad .ic{color:var(--bad)}
.notice.ok{background:var(--ok-soft)}.notice.ok .ic{color:var(--ok)}
.errtxt{color:var(--bad);font-size:.9rem}.errtxt:empty{display:none}
.empty{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.empty .art{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty .art .ic{width:40px;height:40px}
.empty p{color:var(--muted);max-width:34ch}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:shine 1.3s linear infinite;border-radius:var(--r-sm);min-height:20px}
@keyframes shine{to{background-position:-200% 0}}
kbd{font:600 .8rem var(--font);background:var(--surface-2);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:6px;padding:1px 7px}

/* ===== App shell: topbar + bottom tabs on phones, sidebar on desktop ===== */
.shell{min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;height:calc(var(--top-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-inline:var(--s4);display:flex;align-items:center;gap:var(--s3);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);box-shadow:var(--glow);color:#fff;display:grid;place-items:center;flex:none}
.logo .ic{width:18px;height:18px}
.credit-pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:.9rem;text-decoration:none;color:var(--text)}
.credit-pill .ic{color:var(--accent)}
.main{padding:var(--s5) var(--s4) calc(var(--nav-h) + var(--s6) + env(safe-area-inset-bottom));max-width:calc(var(--maxw) + 2 * var(--s4));margin-inline:auto}
.main:focus{outline:none}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:650;position:relative;min-width:0;padding:6px 2px}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab span.lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:inherit;color:inherit;font-weight:inherit}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;line-height:1}
.side{display:none}
@media (min-width:900px){
  .only-mob{display:none!important}
  .shell{display:grid;grid-template-columns:260px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:var(--s2);position:sticky;top:0;height:100vh;padding:var(--s5) var(--s4);background:var(--surface);border-inline-end:1px solid var(--border)}
  .side .brand{margin-bottom:var(--s4);padding-inline:var(--s2)}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:var(--s3);font-size:1rem;padding:0 var(--s3);min-height:46px;border-radius:var(--r-sm)}
  .side .tab:hover{background:var(--surface-2)}
  .side .tab[aria-current="page"]{background:var(--accent-soft)}
  .side .tab[aria-current="page"]::before{display:none}
  .side .badge{position:static;margin-inline-start:auto}
  .side .spacer{flex:1}
  .tabbar,.top .brand{display:none}
  .top{background:transparent;border:0;backdrop-filter:none;justify-content:flex-end;height:var(--top-h)}
  .main{padding-bottom:var(--s7);padding-top:var(--s4)}
  .main.wide{max-width:1040px}
}

/* ===== Toasts ===== */
#toasts{position:fixed;inset-inline:0;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:var(--s4)}
@media (min-width:900px){#toasts{bottom:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:var(--s3);max-width:520px;width:100%;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);backdrop-filter:blur(16px);border-radius:var(--r);padding:10px 10px 10px 16px;padding-inline:16px 10px;box-shadow:var(--shadow-lg);animation:rise .25s ease both;font-weight:550}
.toast .grow{padding-block:4px}
.toast button{background:transparent;border:0;color:inherit;font-weight:800;min-height:40px;padding:0 12px;border-radius:var(--r-pill);text-decoration:underline}
.toast.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.toast .tbar{position:absolute}

/* ===== Auth ===== */
.auth-top{position:absolute;top:calc(var(--s3) + env(safe-area-inset-top));inset-inline-end:var(--s4);display:flex;gap:var(--s2)}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--s3);max-width:420px}
.hero .logo{width:56px;height:56px;border-radius:16px}.hero .logo .ic{width:30px;height:30px}
.hero p{color:var(--muted)}
.perks{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center}

/* ===== Home ===== */
.cta-card{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5);border-radius:var(--r-lg);background:linear-gradient(120deg,#6a46f0,#a24cf0 55%,#e0559e);color:#fff;text-decoration:none;box-shadow:0 18px 50px -14px rgba(139,92,255,.65);position:relative;overflow:hidden;transition:transform .15s}
.cta-card::after{content:"";position:absolute;inset:0;background:radial-gradient(300px 120px at 20% -20%,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.cta-card:hover{transform:translateY(-2px)}
.cta-card .big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1}
.cta-card .btn{background:#fff;color:#4b2fd0;box-shadow:none;border:0;position:relative;z-index:1}
@media (max-width:600px){.cta-card{flex-wrap:wrap;padding:var(--s4)}.cta-card .grow{flex-basis:calc(100% - 70px)}.cta-card .btn{width:100%}.cta-card{order:0}.cta-card .big{font-size:2.2rem}}
.cta-card h2{font-size:1.15rem}
.cta-card p{opacity:.9;font-size:.9rem}
.check-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--border);min-height:56px}
.check-item:first-of-type{border-top:0}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;flex:none;color:transparent}
.dot .ic{width:16px;height:16px}
.check-item.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.check-item.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.check-item.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.check-item .txt{flex:1;min-width:0;font-weight:600}
.check-item .txt small{display:block;font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ===== Job cards + live timeline ===== */
.job{display:flex;flex-direction:column;gap:var(--s3)}
.job-head{display:flex;align-items:flex-start;gap:var(--s3);justify-content:space-between}
.job-title{font-weight:700}
.job-sub{color:var(--muted);font-size:.875rem}
.live{display:flex;align-items:center;gap:var(--s3);font-weight:600}
.live .pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite;flex:none}
.pct{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:var(--s3);align-items:flex-start;position:relative;padding-bottom:var(--s3);color:var(--faint);font-size:.9375rem}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:10px;top:22px;bottom:0;width:2px;background:var(--border);transform:translateX(-1px)}
[dir="rtl"] .tl li::before{transform:translateX(1px)}
.tl li:last-child::before{display:none}
.tl .nd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);flex:none;display:grid;place-items:center;color:#fff;z-index:1}
.tl .nd .ic{width:13px;height:13px}
.tl li.done{color:var(--text)}
.tl li.done .nd{background:var(--ok);border-color:var(--ok)}
.tl li.done::before{background:var(--ok)}
.tl li.now{color:var(--text);font-weight:700}
.tl li.now .nd{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft),0 0 18px rgba(139,92,255,.5)}
.tl li.now .nd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.tl li.failed .nd{border-color:var(--bad);background:var(--bad)}
.tl small{display:block;font-weight:400;color:var(--muted)}
.evlog{font-size:.85rem;color:var(--muted)}
.evlog summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.evlog ul{margin:0;padding-inline-start:18px}

/* ===== Review ===== */
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.pips i.on{background:var(--accent);width:22px;border-radius:5px}
.rv-stage{position:relative}
.rv-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border-strong);user-select:none;-webkit-user-select:none;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;touch-action:pan-y;position:relative;display:grid;grid-template-columns:1fr;will-change:transform;animation:pop .3s ease both}
.rv-card.dragging{transition:none;cursor:grabbing}
.rv-card.settle{transition:transform .22s ease,opacity .22s ease}
.rv-stamp{position:absolute;top:18px;z-index:5;padding:6px 16px;border:3px solid;border-radius:10px;font-weight:900;font-size:1.3rem;letter-spacing:.04em;opacity:0;pointer-events:none;transform:rotate(-10deg);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.rv-stamp.yes{left:18px;color:var(--ok);border-color:var(--ok)}
.rv-stamp.no{right:18px;color:var(--bad);border-color:var(--bad);transform:rotate(10deg)}
.rv-media{padding:var(--s4) var(--s4) 0;display:flex;justify-content:center}
.rv-body{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.player{position:relative;border-radius:var(--r);overflow:hidden;background:#111;color:#fff;display:grid;place-items:center;width:100%;max-width:100%}
.player.v{aspect-ratio:9/16;height:min(40vh,380px);width:auto}
.player.h{aspect-ratio:16/9;width:100%}
.player .poster{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s4);background:var(--pg,linear-gradient(160deg,#5645d4,#e052a0))}
.player .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.player .ptitle{position:relative;z-index:1;font-weight:800;font-size:1.15rem;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.5);overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.player .play{position:relative;z-index:2;width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:transform .15s}
.player .play:hover{transform:scale(1.07)}
.player .play .ic{width:32px;height:32px;margin-inline-start:3px}
.player .ptag{position:absolute;top:12px;inset-inline-start:12px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border-radius:var(--r-pill);padding:3px 10px;font-size:.78rem;font-weight:700;display:flex;gap:6px;align-items:center}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.player .fake{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:var(--s4) var(--s4) var(--s5);background:var(--pg);background-size:300% 300%;animation:drift 6s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.player .cap{font-weight:900;font-size:1.35rem;text-align:center;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6);-webkit-text-stroke:1px rgba(0,0,0,.5);animation:pop .25s ease both;max-width:90%}
.player .scrub{position:absolute;inset-inline:12px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.player .scrub i{display:block;height:100%;background:#fff;width:0}
.title-edit{display:flex;align-items:flex-start;gap:var(--s2)}
.title-edit h2{flex:0 1 auto;font-size:1.2rem;line-height:1.35;overflow-wrap:anywhere}
.title-edit .iconbtn{width:40px;height:40px;color:var(--muted);flex:none}
.title-form{display:flex;flex-direction:column;gap:var(--s2)}
.rv-dock{display:flex;flex-direction:column;gap:var(--s2);position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:10;padding:var(--s4) 0 var(--s2);margin-top:calc(-1 * var(--s2));background:linear-gradient(180deg,transparent,var(--bg) 28%)}
@media (max-width:899px){.player.v{height:min(37vh,340px)}.rv-media{padding-top:var(--s3)}.rv-body{gap:var(--s2)}.rv-from{display:none}.title-edit h2{font-size:1.05rem}}
.rv-inline{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s3)}
.view-review .page-head{margin-bottom:var(--s3)}
@media (max-width:899px){.view-review .page-head{display:none}.main{padding-top:var(--s3)}}
.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);direction:ltr}
.rv-actions .btn{min-height:58px;font-size:1.1rem;border-radius:var(--r)}
.rv-actions .no{background:var(--bad-soft);color:var(--bad);box-shadow:none;border-color:transparent}
.rv-actions .no:hover{background:var(--bad);color:#fff}
.rv-actions .yes{background:linear-gradient(135deg,#17b97a,#3fdc9a);color:#04261a;box-shadow:0 12px 30px -10px rgba(63,220,154,.6);border-color:transparent}
.rv-actions .yes:hover{filter:brightness(1.1)}
.hintline{display:flex;gap:var(--s3);justify-content:center;align-items:center;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.hintline.mob{display:flex}.hintline.desk{display:none}
@media (hover:hover) and (pointer:fine){.hintline.mob{display:none}.hintline.desk{display:flex}}
.meta-row{display:flex;gap:var(--s2);flex-wrap:wrap}
@media (min-width:900px){
  .rv-card{grid-template-columns:auto 1fr;align-items:stretch}
  .rv-media{padding:var(--s5);background:var(--surface-2)}
  .rv-body{padding:var(--s5);justify-content:center;gap:var(--s4)}
  .player.v{height:min(58vh,520px)}
  .player.h{width:min(560px,40vw)}
}

/* ===== Chat ===== */
.chat-wrap{display:flex;flex-direction:column;min-height:calc(100dvh - var(--top-h) - var(--nav-h) - 170px)}
.cnt{background:rgba(255,255,255,.25);border-radius:var(--r-pill);padding:0 9px;font-size:.85rem;min-width:24px;text-align:center}
.msgs{flex:1;display:flex;flex-direction:column;gap:var(--s3);padding-bottom:var(--s4)}
.msg{display:flex;gap:var(--s2);max-width:88%;align-items:flex-end}
.msg .bub{padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--grad);color:#fff;border-color:transparent;border-end-end-radius:6px}
.msg.bot .bub{border-end-start-radius:6px}
.msg .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.msg .av .ic{width:16px;height:16px}
.msg time{display:block;font-size:.72rem;color:var(--faint);margin-top:2px;padding-inline:6px}
.msg.me time{text-align:end}
.act-link{margin-top:var(--s2);display:flex}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 20%);padding-top:var(--s3);margin-inline:calc(-1 * var(--s4));padding-inline:var(--s4);padding-bottom:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
.composer .box{display:flex;gap:var(--s2);align-items:flex-end;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:26px;padding:6px 6px 6px 16px;padding-inline:16px 6px}
.composer textarea{flex:1;border:0;background:transparent;resize:none;max-height:140px;min-height:34px;padding:8px 0;line-height:1.4}
.composer textarea:focus-visible{outline:none}
.composer .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer .send{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);box-shadow:var(--glow);color:#fff;display:grid;place-items:center;flex:none}
.composer .send[disabled]{opacity:.4}
.composer .send .flip-send{transform:scaleX(-1)}
[dir="ltr"] .composer .send .flip-send{transform:none}
.chipscroll{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chipscroll::-webkit-scrollbar{display:none}
.chipscroll .chip{flex:none}
@media (min-width:900px){.composer{bottom:0;margin-inline:0;padding-inline:0}.chat-wrap{min-height:calc(100vh - var(--top-h) - 190px)}}

/* ===== Team / credits / settings ===== */
.big-num{font-size:3.2rem;font-weight:850;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring{--p:50;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring .big-num{font-size:2.2rem}
.role-card{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3);border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--surface)}
.role-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.role-card input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.role-card b{display:block}
.role-card span{color:var(--muted);font-size:.875rem}
.linkbox{display:flex;gap:var(--s2);align-items:center;background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s2) var(--s2) var(--s2) var(--s3);padding-inline:var(--s3) var(--s2)}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;font-size:.85rem}
.switch{position:relative;display:inline-block;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:14px;background:var(--border-strong);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
[dir="rtl"] .switch input:checked+i::after{transform:translateX(-20px)}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+i{opacity:.5}
.switch input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.menu-item{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);min-height:60px;text-decoration:none;color:var(--text);border-top:1px solid var(--border);font-weight:600;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.menu-item:first-child{border-top:0}
.menu-item .ic:first-child{color:var(--accent);width:24px;height:24px}
.menu-item .grow small{display:block;font-weight:400;color:var(--muted)}
.menu-card{padding:0;overflow:hidden}

/* ===== Setup wizard ===== */
.stepper{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s5)}
.stepper .st{display:flex;align-items:center;gap:var(--s2);color:var(--muted);font-weight:650;font-size:.875rem}
.stepper .st b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:.9rem;flex:none}
.stepper .st.done b{background:var(--ok);color:#fff}
.stepper .st.now{color:var(--text)}.stepper .st.now b{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stepper .ln{flex:1;height:2px;background:var(--border);min-width:12px}
.stepper .ln.done{background:var(--ok)}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4);border:2px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.code-box code{font:800 1.6rem/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;direction:ltr;user-select:all;overflow-wrap:anywhere}
ol.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.plat{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.plat i{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.plat.kick i{background:#53fc18}.plat.twitch i{background:#9146ff}
.yt-badge{width:44px;height:32px;border-radius:9px;background:#e62117;color:#fff;display:grid;place-items:center;flex:none}
.yt-badge .ic{width:18px;height:18px}
.yt-badge .ic svg{fill:#fff;stroke:none}
.opt{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3);border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.off{opacity:.65}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.opt b{display:block}.opt span{color:var(--muted);font-size:.875rem}

/* ===== premium layer: content column, ribbon, landing, misc ===== */
.content{min-width:0}
.boot{min-height:100vh;display:grid;place-items:center;gap:var(--s3);color:var(--accent)}
.boot .spin{width:34px;height:34px}
.center{text-align:center}.tabnum{font-variant-numeric:tabular-nums}
.trunc{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
select.input.sel{width:auto;min-width:110px;padding-block:6px}
.input.lg{min-height:54px;font-size:1.05rem}
.wrapli{flex-wrap:wrap}
.mail{font-weight:600;font-size:.95rem}
@media (max-width:520px){.rd{display:none}.list>.li{gap:var(--s2)}.list .grow{overflow:hidden}}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}.ticks .ic{color:var(--ok);margin-top:3px}
.empty .art.ok{background:var(--ok-soft);color:var(--ok)}
.empty .art{box-shadow:0 0 0 8px var(--accent-soft)}
.empty .art.ok{box-shadow:0 0 0 8px var(--ok-soft)}
.orgchip{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border)}
.orgchip .orgname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detect{min-height:28px}
.glassbtn{background:var(--glass);border:1px solid var(--border)}
.live-card{border-color:rgba(139,109,255,.45);box-shadow:var(--shadow),0 0 0 1px rgba(139,109,255,.2),0 12px 48px -18px rgba(139,92,255,.55)}
.ribbon{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s4);background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:.78rem;font-weight:650;white-space:nowrap;overflow:hidden}
.ribbon .ic{width:1em;height:1em;color:var(--accent)}
.ribbon button{border:1px solid var(--border-strong);background:var(--glass);border-radius:var(--r-pill);padding:4px 12px;font-size:.78rem;font-weight:650;min-height:30px}
.ribbon button:hover{border-color:var(--accent)}
.orgchip,.side .tab{transition:background .15s}
.stepper .lbl-s{white-space:nowrap}
@media (max-width:520px){.stepper .lbl-s{display:none}.stepper .st.now .lbl-s{display:inline}}

/* landing / auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"copy" "card" "vis";justify-items:center;align-content:center;gap:var(--s5);min-height:100vh;min-height:100dvh;padding:calc(var(--s7) + env(safe-area-inset-top)) var(--s4) var(--s6);position:relative;overflow:hidden}
.landing{grid-area:copy;display:flex;flex-direction:column;gap:var(--s4);max-width:560px;width:100%}
.auth .authcard{grid-area:card;width:100%;max-width:440px;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);box-shadow:var(--shadow-lg);border-color:var(--border-strong);background:var(--glass)}
.visual{grid-area:vis;width:100%}
.auth-top{position:absolute;top:calc(var(--s3) + env(safe-area-inset-top));inset-inline-end:var(--s4);display:flex;gap:var(--s2);align-items:center;z-index:5}
.brand.big{font-size:1.25rem}
.lead{color:var(--muted);font-size:1.0625rem;max-width:48ch}
.perks{display:flex;gap:var(--s2);flex-wrap:wrap}
.perks .chip{background:var(--glass);border:1px solid var(--border);min-height:32px}
.perks .ic{color:var(--accent)}
.stage{position:relative;height:330px;width:100%;max-width:440px;margin-inline:auto}
.ph{position:absolute;top:10px;width:138px;aspect-ratio:9/16;border-radius:22px;background:var(--g);box-shadow:var(--shadow-lg),0 0 0 1px rgba(255,255,255,.16) inset;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:14px;overflow:hidden;color:#fff;animation:floaty 7s ease-in-out infinite}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.45));pointer-events:none}
.phcap{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.phbar{position:relative;z-index:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.ph.p1{left:calc(50% - 69px);z-index:3;top:0;transform-origin:50% 100%;animation:floaty 7s ease-in-out infinite,swipeDemo 7s ease-in-out infinite}
.ph.p2{left:calc(50% - 168px);z-index:2;top:26px;transform:rotate(-9deg);animation-delay:-2.3s}
.ph.p3{left:calc(50% + 30px);z-index:1;top:26px;transform:rotate(9deg);animation-delay:-4.6s}
@keyframes floaty{50%{translate:0 -9px}}

.float{position:absolute;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--border-strong);backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);font-size:.82rem;animation:floaty 6s ease-in-out infinite}
.float .ic{color:var(--accent)}
.float b{display:block;font-weight:650}
.float .bar{display:block;width:150px;margin-top:6px;height:6px}
.float .bar i.anim{animation:fillbar 5s ease-in-out infinite;width:10%}
@keyframes fillbar{0%{width:6%}80%,100%{width:96%}}
.float.f1{inset-inline-end:0;top:62px;animation-delay:-1s}
.float.f2{inset-inline-start:0;bottom:34px;animation-delay:-3s;padding:8px 14px 8px 10px}
.float .okdot{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.float .okdot .ic{color:#fff;width:15px;height:15px}
@media (min-width:900px){
  .auth{grid-template-columns:minmax(0,1fr) 440px;grid-template-areas:"copy card" "vis card";column-gap:72px;row-gap:var(--s4);justify-items:stretch;align-content:center;max-width:1180px;margin-inline:auto;padding-inline:var(--s6)}
  .auth .authcard{justify-self:end;align-self:center}
