<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Heebo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffb21e'/%3E%3Cpath d='M4 24 24 4' stroke='%2317110a' stroke-width='5'/%3E%3Ccircle cx='25' cy='7' r='3' fill='%23ff4a3d'/%3E%3C/svg%3E">
<style>
/* ===================================================================================================
   STUDIO visual identity: an edit bay. Ink/graphite panels with hairlines, ONE signal colour (tally amber),
   red only for REC / reject / errors, green only for approved. Timecode in mono, condensed display type,
   waveforms, a scrubbing timeline, viewfinder corners, SMPTE bars for empty states. No gradients, no glow.
   =================================================================================================== */
:root{
  /* dark: "ink" (warm graphite) */
  --bg:#0e0d0b; --panel:#171512; --panel-2:#1f1c18; --panel-3:#2a2620; --line:#2e2a24; --line-2:#463f35;
  --text:#efeadf; --muted:#a39c8d; --faint:#6e675a;
  --sig:#ffb21e; --sig-dark:#a56f00; --sig-ink:#17110a; --sig-soft:rgba(255,178,30,.12); --sig-text:#ffb21e;
  --rec:#ff4a3d; --rec-soft:rgba(255,74,61,.14); --ok:#72e083; --ok-soft:rgba(114,224,131,.13); --ok-ink:#07240f;
  --shadow:0 0 0 1px var(--line); --shadow-lg:0 18px 40px -18px rgba(0,0,0,.8);
  --wave:#4b443a; --wave-on:var(--sig);
  --r:4px; --r-lg:6px; --r-pill:3px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --font:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Heebo,Arial,sans-serif;
  --display:"Barlow Condensed",Heebo,"IBM Plex Sans Hebrew",system-ui,"Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:62px; --top-h:52px; --tap:46px; --maxw:780px;
  /* legacy aliases used by inline styles in JS */
  --surface:var(--panel); --surface-2:var(--panel-2); --border:var(--line); --border-strong:var(--line-2);
  --accent:var(--sig-text); --accent-soft:var(--sig-soft); --bad:var(--rec); --bad-soft:var(--rec-soft); --warn:var(--sig-text); --warn-soft:var(--sig-soft);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e9e4d7; --panel:#f5f1e6; --panel-2:#ebe5d6; --panel-3:#ddd5c2; --line:#cdc5b0; --line-2:#9e947c;
  --text:#17140d; --muted:#5a5342; --faint:#877f6a;
  --sig:#f5a800; --sig-dark:#a06c00; --sig-ink:#17110a; --sig-soft:rgba(160,108,0,.12); --sig-text:#8a5a00;
  --rec:#cf2a1d; --rec-soft:rgba(207,42,29,.1); --ok:#17763a; --ok-soft:rgba(23,118,58,.12); --ok-ink:#fff;
  --shadow-lg:0 14px 30px -16px rgba(60,45,10,.35); --wave:#b9af98;
}}
:root[data-theme="light"]{
  --bg:#e9e4d7; --panel:#f5f1e6; --panel-2:#ebe5d6; --panel-3:#ddd5c2; --line:#cdc5b0; --line-2:#9e947c;
  --text:#17140d; --muted:#5a5342; --faint:#877f6a;
  --sig:#f5a800; --sig-dark:#a06c00; --sig-ink:#17110a; --sig-soft:rgba(160,108,0,.12); --sig-text:#8a5a00;
  --rec:#cf2a1d; --rec-soft:rgba(207,42,29,.1); --ok:#17763a; --ok-soft:rgba(23,118,58,.12); --ok-ink:#fff;
  --shadow-lg:0 14px 30px -16px rgba(60,45,10,.35); --wave:#b9af98;
}

/* ===== base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--font);-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh}
h1,h2,h3,p{margin:0}
h1,h2,h3,.display,.brand{font-family:var(--display)}
h1{font-size:2rem;line-height:1;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:1.25rem;line-height:1.15;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:1rem;font-weight:700}
.display{font-size:clamp(2.2rem,9vw,3.1rem);line-height:.98;font-weight:700;letter-spacing:.005em;text-transform:uppercase}
[lang="he"] h1,[lang="he"] h2,[lang="he"] .display,[lang="he"] .brand{font-family:Heebo,var(--font);letter-spacing:0;font-weight:800}
[lang="he"] h1{font-size:1.9rem;line-height:1.1}[lang="he"] h2{font-size:1.15rem;line-height:1.25}[lang="he"] .display{line-height:1.05;font-size:clamp(2.1rem,8.4vw,2.9rem)}
.mono,.tc,.eyebrow,.chip,kbd,.tag{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sig-text)}
bdi,.ltr{unicode-bidi:isolate}.ltr{direction:ltr;display:inline-block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px;border-radius:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--sig);color:var(--sig-ink);padding:10px 14px;z-index:100;text-decoration:none;font-weight:700}
.skip:focus{top:8px}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}.tabnum{font-variant-numeric:tabular-nums}
.ic{display:inline-flex;width:1.25em;height:1.25em;flex:none;vertical-align:middle}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
[dir="rtl"] .flip{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.18}}
@keyframes shine{to{background-position:-200% 0}}
.enter>*{animation:rise .3s ease both}.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px var(--rec-soft);animation:blink 1.1s steps(1) infinite;flex:none}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.eyebrow b{color:var(--sig-text);font-weight:600}
[lang="he"] .eyebrow,[lang="he"] .chip,[lang="he"] .tag,[lang="he"] .hintline,[lang="he"] .rv-head,[lang="he"] .authcard .bar-h,[lang="he"] .nle-status,[lang="he"] .toast button,[lang="he"] .evlog summary{letter-spacing:.01em;text-transform:none;font-family:var(--font)}
[lang="he"] .chip,[lang="he"] .tag{font-size:.78rem;font-weight:600}
[lang="he"] .eyebrow{font-size:.82rem}
.eyebrow b,.eyebrow [data-tc]{font-family:var(--mono)}

/* ===== buttons: hardware keys ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 18px;border-radius:var(--r);border:0;font-weight:700;text-decoration:none;background:var(--sig);color:var(--sig-ink);box-shadow:0 3px 0 var(--sig-dark);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;user-select:none;letter-spacing:.01em}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sig-dark)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.secondary{background:var(--panel-2);color:var(--text);box-shadow:0 3px 0 var(--line),inset 0 0 0 1px var(--line-2)}
.btn.secondary:hover{background:var(--panel-3)}
.btn.secondary:active{box-shadow:0 1px 0 var(--line),inset 0 0 0 1px var(--line-2)}
.btn.ghost{background:transparent;color:var(--sig-text);box-shadow:none;padding:0 12px}.btn.ghost:hover{background:var(--sig-soft);filter:none}.btn.ghost:active{transform:none}
.btn.lg{min-height:56px;padding:0 24px;font-size:1.05rem}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem}
.btn.block{width:100%}
.btn.bulk{min-height:40px;font-size:.9rem}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:var(--r);border:0;background:transparent;color:var(--text);position:relative;text-decoration:none}
.iconbtn:hover{background:var(--panel-3)}
.cnt{background:var(--sig-ink);color:var(--sig);border-radius:2px;padding:0 7px;font:600 .8rem var(--mono);min-width:22px;text-align:center}

/* ===== tags / chips ===== */
.chip,.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 8px;border-radius:2px;background:var(--panel-3);color:var(--muted);font-size:.7rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.chip .ic,.tag .ic{width:1.1em;height:1.1em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--rec-soft);color:var(--rec)}
.chip.warn,.chip.accent{background:var(--sig-soft);color:var(--sig-text)}
.chip.recc{background:var(--rec);color:#fff}
button.chip{font:500 .95rem var(--font);text-transform:none;letter-spacing:0;min-height:42px;padding:6px 14px;background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);white-space:normal;text-align:start;border:0;border-radius:var(--r)}
button.chip:hover{box-shadow:inset 0 0 0 1px var(--sig);background:var(--sig-soft)}
button.chip .ic{color:var(--sig-text)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* ===== form ===== */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
[lang="he"] .field label,[lang="he"] .lbl{font:600 .85rem var(--font);letter-spacing:0;text-transform:none}
.input,select.input,textarea.input{width:100%;min-height:var(--tap);padding:10px 12px;border-radius:var(--r);border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--bg);color:var(--text)}
.input::placeholder{color:var(--faint)}
.input:focus-visible{outline:2px solid var(--sig);outline-offset:0;box-shadow:inset 0 0 0 1px var(--sig)}
.input[aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--rec)}
.input.lg{min-height:56px;font-size:1.1rem;font-family:var(--mono)}
select.input.sel{width:auto;min-width:110px;padding-block:6px}
.pwrap{position:relative;direction:ltr}.pwrap .iconbtn{position:absolute;right:2px;top:0;height:100%;width:var(--tap);color:var(--muted)}.pwrap .input{padding-right:48px;text-align:left}
.errtxt{color:var(--rec);font-size:.9rem}.errtxt:empty{display:none}
.emailbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.emailbox summary{cursor:pointer;font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;list-style:none;padding:6px}.emailbox summary::-webkit-details-marker{display:none}.emailbox[open] summary{margin-bottom:10px}
.seg{display:inline-flex;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 14px;border-radius:2px;font:600 .8rem var(--mono);letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sig);color:var(--sig-ink)}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:2px;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2);pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:1px;background:var(--faint);transition:transform .15s}
.switch input:checked+i{background:var(--sig-soft)}.switch input:checked+i::after{background:var(--sig);transform:translateX(20px)}[dir="rtl"] .switch input:checked+i::after{transform:translateX(-20px)}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+i{opacity:.55}
.switch input:focus-visible+i{outline:2px solid var(--sig);outline-offset:2px}
kbd{font-size:.72rem;font-weight:600;background:var(--panel-3);color:var(--text);border-radius:2px;padding:1px 7px;box-shadow:0 2px 0 var(--line-2);display:inline-block;min-width:22px;text-align:center}

/* ===== panels ===== */
.card{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:var(--s4);position:relative}
.card.pad-lg{padding:var(--s5)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}.stack.tight{gap:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s3)}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s5)}
.page-head p{color:var(--muted)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s5) 0 var(--s3)}
.sec-title h2{font-size:1rem}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line);min-height:56px}.list>.li:first-child{border-top:0}
.wrapli{flex-wrap:wrap}
.avatar{width:38px;height:38px;border-radius:2px;background:var(--panel-3);color:var(--sig-text);display:grid;place-items:center;font:600 .85rem var(--mono);flex:none;text-transform:uppercase}
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--sig);font-size:.9375rem}
[dir="rtl"] .notice{box-shadow:inset -3px 0 0 var(--sig)}
.notice .ic{color:var(--sig-text);margin-top:2px}
.notice.warn{background:var(--sig-soft)}
.notice.bad{background:var(--rec-soft);box-shadow:inset 3px 0 0 var(--rec)}[dir="rtl"] .notice.bad{box-shadow:inset -3px 0 0 var(--rec)}.notice.bad .ic{color:var(--rec)}
.notice.ok{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}[dir="rtl"] .notice.ok{box-shadow:inset -3px 0 0 var(--ok)}.notice.ok .ic{color:var(--ok)}
.skel{background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));background-size:200% 100%;animation:shine 1.3s linear infinite;border-radius:var(--r);min-height:20px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.ticks li{display:flex;gap:10px;align-items:flex-start}.ticks .ic{color:var(--ok);margin-top:3px}
.bar{height:6px;border-radius:1px;background:var(--panel-3);overflow:hidden}.bar>i{display:block;height:100%;background:var(--sig);transition:width .6s ease}
.divider{height:1px;background:var(--line);margin:var(--s3) 0;border:0}
/* empty states: SMPTE colour bars ("no signal") */
.empty{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.empty p{color:var(--muted);max-width:36ch}
.empty .art{width:132px;height:84px;position:relative;border-radius:2px;overflow:hidden;background:linear-gradient(90deg,#c8c8c8 0 14.28%,#c8c800 0 28.56%,#00c8c8 0 42.84%,#00c800 0 57.12%,#c800c8 0 71.4%,#c80000 0 85.68%,#0000c8 0);filter:saturate(.7) brightness(.82);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line-2)}
.empty .art::before{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(90deg,#111 0 14%,#fff 0 28%,#111 0 42%,#2a2a2a 0 57%,#111 0 71%,#222 0 85%,#111 0)}
.empty .art .ic{position:relative;z-index:1;width:30px;height:30px;color:var(--text);background:var(--bg);padding:6px;border-radius:2px;box-sizing:content-box;stroke-width:2}
.empty .art.ok{filter:saturate(.9) brightness(.9)}
.empty .art .ic svg{stroke-width:2.2}
.empty .art.ok .ic{color:var(--ok)}

/* ===== shell ===== */
.shell{min-height:100vh;min-height:100dvh}
.content{min-width:0}
.top{position:sticky;top:0;z-index:20;height:calc(var(--top-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-inline:var(--s4);display:flex;align-items:center;gap:var(--s3);background:var(--bg);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;inset-inline:0;bottom:-7px;height:6px;background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 40px);background-size:100% 3px,100% 6px;background-repeat:repeat-x;background-position:0 0,0 0;background-repeat:no-repeat;pointer-events:none;opacity:.7}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.3rem;color:var(--text);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
[lang="he"] .brand{letter-spacing:.04em}
.logo{width:26px;height:26px;border-radius:2px;background:var(--sig);color:var(--sig-ink);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.logo::before{content:"";position:absolute;width:140%;height:3px;background:var(--sig-ink);transform:rotate(-52deg)}
.logo::after{content:"";position:absolute;inset-inline-end:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--rec)}
.logo .ic{display:none}
.clock{font:500 .78rem var(--mono);letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.clock b{color:var(--text);font-weight:500}
.credit-pill{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;border-radius:2px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line-2);font:600 .85rem var(--mono);text-decoration:none;color:var(--text)}
.credit-pill .ic{color:var(--sig-text);width:1em;height:1em}
.main{padding:var(--s6) var(--s4) calc(var(--nav-h) + var(--s6) + env(safe-area-inset-bottom));max-width:calc(var(--maxw) + 2*var(--s4));margin-inline:auto}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line-2)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font:600 .66rem var(--mono);letter-spacing:.06em;text-transform:uppercase;position:relative;min-width:0;padding:6px 2px}
[lang="he"] .tab{font:600 .72rem var(--font);letter-spacing:0;text-transform:none}
.tab .ic{width:22px;height:22px}
.tab .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;color:inherit;letter-spacing:inherit}
.tab .idx{display:none}
.tab[aria-current="page"]{color:var(--sig-text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;inset-inline:18%;height:3px;background:var(--sig)}
.badge{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:2px;background:var(--rec);color:#fff;font:700 .68rem var(--mono);display:grid;place-items:center;line-height:1}
.side{display:none}
@media (min-width:900px){
  .only-mob{display:none!important}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:var(--s4) var(--s3);background:var(--panel);border-inline-end:1px solid var(--line-2)}
  .side .brand{margin-bottom:var(--s5);padding:var(--s2) var(--s2) var(--s3);border-bottom:1px solid var(--line)}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:var(--s3);font:500 .95rem var(--font);letter-spacing:0;text-transform:none;padding:0 var(--s3);min-height:44px;border-radius:2px}

/* ===== toasts ===== */

/* ===== waveform + timecode motifs ===== */
.wave{display:flex;align-items:center;gap:2px;height:28px}

.strip{direction:ltr}

.strip .head::before{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top-color:var(--rec);border-bottom:0;margin-left:-1px}

/* ===== landing / auth ===== */
.auth{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"copy" "card" "vis";justify-items:stretch;align-content:start;gap:var(--s5);min-height:100vh;min-height:100dvh;padding:calc(76px + env(safe-area-inset-top)) var(--s4) var(--s6);position:relative;max-width:520px;margin-inline:auto}
.auth-top{position:absolute;top:calc(var(--s3) + env(safe-area-inset-top));inset-inline:var(--s4);display:flex;gap:var(--s2);align-items:center;justify-content:space-between;z-index:5}
.auth-top .grp{display:flex;gap:var(--s2);align-items:center}
.landing{grid-area:copy;display:flex;flex-direction:column;gap:var(--s4)}
.landing .display .hot{color:var(--sig-text);display:block}
.lead{color:var(--muted);font-size:1.05rem;max-width:50ch}

.visual{grid-area:vis}
.nle{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow-lg);border-radius:var(--r-lg);overflow:hidden;font-family:var(--mono);direction:ltr}
.nle-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line-2);font-size:.68rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.nle-ruler span{position:absolute;top:5px;font-size:.58rem;color:var(--faint);letter-spacing:.04em}

.nle-track>em{font-style:normal;font-size:.6rem;color:var(--faint);width:18px;flex:none;letter-spacing:.06em}
.nle-frames{flex:1;height:38px;border-radius:2px;display:flex;gap:2px;overflow:hidden;position:relative}
.nle-frames i{flex:1;background:var(--c);opacity:.9}
.nle-wave{flex:1;display:flex;align-items:center;gap:1.5px;height:38px}
.nle-wave i{flex:1;background:var(--wave);height:var(--h);border-radius:1px}
.nle-area{position:relative}
.nle-mk{position:absolute;top:-2px;bottom:-2px;width:0;border-inline-start:2px solid var(--sig);z-index:2}

@keyframes c1{0%,15%{opacity:.2;transform:translateY(4px)}18%,94%{opacity:1;transform:none}98%,100%{opacity:.2;transform:translateY(4px)}}
@keyframes c2{0%,34%{opacity:.2;transform:translateY(4px)}37%,94%{opacity:1;transform:none}98%,100%{opacity:.2;transform:translateY(4px)}}

/* ===== home ===== */

/* ===== jobs ===== */

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;inset-inline-start:10px;top:22px;bottom:0;width:2px;background:var(--line);transform:translateX(-1px)}[dir="rtl"] .tl li::before{transform:translateX(1px)}
.tl li:last-child::before{display:none}
.tl .nd{width:22px;height:22px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--line-2);background:var(--bg);flex:none;display:grid;place-items:center;color:var(--ok-ink);z-index:1}

.evlog{font:500 .8rem var(--mono);color:var(--muted)}.evlog summary{cursor:pointer;min-height:36px;display:flex;align-items:center;letter-spacing:.06em;text-transform:uppercase}.evlog ul{margin:0;padding-inline-start:18px}

/* ===== review (clip bin card) ===== */
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}

.title-edit{display:flex;align-items:flex-start;gap:var(--s2);padding-inline-start:12px;position:relative}

.rv-dock{display:flex;flex-direction:column;gap:var(--s2);position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:10;padding:var(--s4) 0 var(--s2);margin-top:calc(-1*var(--s2));background:linear-gradient(180deg,transparent,var(--bg) 28%)}

.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);direction:ltr}

function stCategory(t) {

  if (/^(ביי|להתראות|נתראה|לילה טוב|bye|goodbye|see you|cya|good night)(?= |$)/.test(x)) return "bye";
  if (/^(תודה|תודה רבה|thanks|thank you|thx)(?= |$)/.test(x)) return "thanks";
  if (w.length <= 3 && /^(כן|בטח|יאללה|אוקיי|אוקי|סבבה|yes|yeah|yep|sure|ok|okay)(?= |$)/.test(x)) return x.match(/^(אוקיי|אוקי|סבבה|ok|okay)/) ? "ok" : "yes";
  if (w.length <= 3 && /^(לא|no|nope|nah|עזוב|ביטול|cancel)(?= |$)/.test(x)) return "no";
  if (has(/כמה (זה )?(עולה|עלות|מחיר|קרדיט)|מחיר|עולה|תשלום|price|cost|how much|pricing|credits?(?= |$)/) ) return "price";
  if (has(/^(למה|מדוע|why|how come)(?= |$)|^איך (זה )?עובד|how (does|do) (it|this)/)) return "why";
  if (has(/מה (אתה|את|אפשר|ניתן) (יכול|יכולה|לעשות|לבקש)|במה אתה|עזרה|\bhelp\b|what can you|what do you do|מה אתה עושה/)) return "what";
  if (has(/^(מי אתה|מי את|who are you|what are you)/)) return "who";
  if (w.length <= 2 && /^(הכל|הכול|everything|all)$/.test(x)) return "all";
