name: live-watch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
concurrency:
  group: live-watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check live and ingest new audio
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/live_watch.py
      - name: Commit state
        run: |
          git config user.name "highlights-bot"
          git config user.email "highlights-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state: live watch $(date -u +%FT%TZ)"
          git pull --rebase -q || true
          git push
