name: live-loop
# GitHub's cron did not fire for this repo (0 scheduled runs in 4 h). This job does the polling itself:
# it loops for ~5h40m (check every 5 min), then dispatches the next run of itself (workflow_dispatch via GITHUB_TOKEN is allowed).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"   # backup starter in case the chain ever breaks
concurrency:
  group: live-watch
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ivrit-whisper-turbo-ct2-v1
      - name: Install ASR
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper "av==15.1.0"
      - name: Poll loop
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASR: ivrit
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          nohup python3 scripts/chat_poll.py --seconds 20300 --poll 10 > /tmp/chat_poll.log 2>&1 &
          end=$((SECONDS+20400))
          while [ $SECONDS -lt $end ]; do
            [ -f state/PAUSE ] && { echo "PAUSE file present, stopping"; exit 0; }
            LIVE_STATUS_ONLY=1 python3 scripts/live_watch.py || echo "status check failed (continuing)"
            python3 scripts/stations/live_alert.py || echo "alert failed (continuing)"
            git add state; git diff --cached --quiet || { git commit -q -m "state: status $(date -u +%FT%TZ)"; git pull --rebase -q || true; git push -q || true; }
            python3 scripts/live_watch.py || echo "live_watch failed (continuing)"
            python3 scripts/stations/live_alert.py || echo "alert failed (continuing)"
            git add state
            if ! git diff --cached --quiet; then
              git commit -q -m "state: live watch $(date -u +%FT%TZ)"
              git pull --rebase -q || true
              git push -q || true
            fi
            python3 scripts/autopilot.py || echo "autopilot failed (continuing)"
            python3 scripts/stations/pick.py || echo "pick station failed (continuing)"
            python3 scripts/yt_stats.py || echo "stats failed (continuing)"
            python3 scripts/stations/monitor.py --no-restart || echo "monitor flagged a problem"
            python3 scripts/stations/timeline.py || echo "timeline skipped"
            python3 scripts/stations/index.py || echo "index failed (continuing)"
            python3 scripts/stations/brief.py || echo "brief skipped"
            git add state; git diff --cached --quiet || { git commit -q -m "state: pick $(date -u +%FT%TZ)"; git pull --rebase -q || true; git push -q || true; }
            B=$(python3 -c 'import json;print(json.load(open("state/ingest_state.json")).get("_behind_segs",0))' 2>/dev/null || echo 0)
            LIVE=$(python3 -c 'import json;print(json.load(open("state/live_status.json")).get("live"))' 2>/dev/null || echo False)
            if [ "${B:-0}" -gt 12 ]; then echo "transcription is $B segments behind: no sleep"; elif [ "$LIVE" = "True" ]; then sleep 45; else sleep 300; fi
          done
          gh workflow run live-loop.yml --ref main
