name: http-probe
# Fetches a few URLs from a runner and prints status + first bytes (the sandbox cannot reach *.workers.dev).
on:
  workflow_dispatch:
    inputs:
      base: { required: true }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) echo "only workers.dev"; exit 1;; esac
          for p in /studio /studio/api/health "/studio/api/health?ai=1"; do
            echo "== $p"; curl -sS -m 30 -o /tmp/o -w "%{http_code} %{content_type} %{size_download}B\n" "$BASE$p"; head -c 700 /tmp/o | tr '\n' ' '; echo
          done
      - env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) exit 1;; esac
          G=$(curl -sS -m 30 -X POST -H 'content-type: application/json' -d '{}' "$BASE/studio/api/guest")
          TK=$(echo "$G" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])"); OID=$(echo "$G" | python3 -c "import sys,json;print(json.load(sys.stdin)['org_id'])")
          for m in "שלום" "מה אתה יכול לעשות?" "hello, how do credits work?"; do
            echo "== chat: $m"; curl -sS -m 90 -X POST -H "authorization: Bearer $TK" -H 'content-type: application/json' -d "{\"message\":\"$m\"}" "$BASE/studio/api/orgs/$OID/assistant" | head -c 600; echo
          done
          echo "== diag"; curl -sS -m 30 "$BASE/studio/api/health?ai=1" | head -c 900; echo
