name: http-probe
# Fetches a few URLs from a runner and prints status + first bytes (the sandbox cannot reach *.workers.dev).
on:
  workflow_dispatch:
    inputs:
      base: { required: true }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) echo "only workers.dev"; exit 1;; esac
          for p in /studio /studio/api/health "/studio/api/health?ai=1"; do
            echo "== $p"; curl -sS -m 30 -o /tmp/o -w "%{http_code} %{content_type} %{size_download}B\n" "$BASE$p"; head -c 700 /tmp/o | tr '\n' ' '; echo
          done
      - env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) exit 1;; esac
          G=$(curl -sS -m 30 -X POST -H 'content-type: application/json' -d '{}' "$BASE/studio/api/guest")
          TK=$(echo "$G" | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])"); OID=$(echo "$G" | python3 -c "import sys,json;print(json.load(sys.stdin)['org_id'])")
          for m in "שלום" "מה אתה ממליץ" "https://www.twitch.tv/videos/123456789" "תכין 3 שורטס מצחיקים https://www.twitch.tv/videos/123456789"; do
            echo "== chat: $m"; curl -sS -m 90 -X POST -H "authorization: Bearer $TK" -H 'content-type: application/json' -d "{\"message\":\"$m\"}" "$BASE/studio/api/orgs/$OID/assistant" | head -c 1500; echo
          done
          echo "== diag"; curl -sS -m 30 "$BASE/studio/api/health?ai=1" | head -c 900; echo
      - env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) exit 1;; esac
          for m in "@cf/openai/gpt-oss-120b" "@cf/google/gemma-3-12b-it" "@cf/mistralai/mistral-small-3.1-24b-instruct" "@cf/qwen/qwen3-30b-a3b-fp8" "@cf/meta/llama-4-scout-17b-16e-instruct" "@cf/meta/llama-3.3-70b-instruct-fp8-fast"; do
            echo "== model $m"; curl -sS -m 90 -G --data-urlencode "evalmodel=$m" "$BASE/studio/api/health" | head -c 1100; echo
          done
      - name: what does the run token see (names only)
        env:
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          curl -sS -m 30 -o /tmp/g -w "installation/repositories HTTP %{http_code}\n" -H "authorization: Bearer $GH_RUN_TOKEN" -H "accept: application/vnd.github+json" -H "user-agent: probe" "https://api.github.com/installation/repositories?per_page=100"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/g')); print("keys:", list(d.keys())[:6]); print("repos:", [r.get("full_name") for r in d.get("repositories", [])] if isinstance(d.get("repositories"), list) else d.get("message"))
          PY
      - name: studio worker queue with the run token (body only)
        env:
          BASE: ${{ inputs.base }}
          GH_RUN_TOKEN: ${{ github.token }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) exit 1;; esac
          printf 'header = "x-worker-key: %s"\n' "$GH_RUN_TOKEN" | curl -sS -m 30 -K - -X POST -w '\nHTTP %{http_code}\n' "$BASE/studio/worker/queue" | head -c 400
      - env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in https://*.workers.dev) ;; *) exit 1;; esac
          echo "== config"; curl -sS -m 30 "$BASE/studio/api/config"; echo
          echo "== guest without code"; curl -sS -m 30 -X POST -H 'content-type: application/json' -d '{}' "$BASE/studio/api/guest"; echo
          echo "== terms"; curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "$BASE/studio/terms"
