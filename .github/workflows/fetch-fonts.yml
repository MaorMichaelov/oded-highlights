name: fetch-fonts
# One-off: download the free (SIL OFL) display fonts for thumbnails/captions into assets/fonts and commit them (the sandbox cannot reach GitHub/Google font hosts; runners can).
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/fonts; cd assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o Anton-Regular.ttf $B/anton/Anton-Regular.ttf
          curl -fsSL -o BebasNeue-Regular.ttf $B/bebasneue/BebasNeue-Regular.ttf
          curl -fsSL -o Bangers-Regular.ttf $B/bangers/Bangers-Regular.ttf
          curl -fsSL -o Montserrat-Black.ttf "$B/montserrat/Montserrat%5Bwght%5D.ttf" || true
          curl -fsSL -o Heebo.ttf "$B/heebo/Heebo%5Bwght%5D.ttf" || true
          ls -la; file *
      - run: |
          git config user.name highlights-bot; git config user.email highlights-bot@users.noreply.github.com
          git add assets/fonts; git commit -qm "fonts: Anton, Bebas Neue, Bangers (OFL)" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i*2)); done
