name: vod-shorts
# Cuts vertical Shorts (English) from a Kick streamer's past VOD window. Output: mp4 + json as an artifact (and committed json meta).
on:
  workflow_dispatch:
    inputs:
      slug: { description: "Kick slug", required: false, default: "n3on" }
      vod: { description: "VOD id or auto (newest non-gambling)", required: false, default: "auto" }
      from_min: { required: false, default: "0" }
      to_min: { required: false, default: "60" }
      n: { required: false, default: "3" }
concurrency: { group: vod-shorts, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy
          bash scripts/setup_workspace.sh
      - name: Shorts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -u scripts/vod_shorts.py --slug "${{ inputs.slug }}" --vod "${{ inputs.vod }}" --from-min "${{ inputs.from_min }}" --to-min "${{ inputs.to_min }}" --n "${{ inputs.n }}"
      - name: QA - Gemini watches the first Shorts
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q yt-dlp
          for f in $(ls state/${{ inputs.slug }}/shorts/*.mp4 2>/dev/null | head -2); do
            echo "WATCH|FILE $f"; python3 scripts/watch_video.py "$f" "QUALITY CHECK of OUR OWN edit (a 9:16 YouTube Short made automatically). Ignore question 3 and 5 of the normal list. Report in Hebrew: (a) is the layout correct, nothing cut off, face/subject visible; (b) are the captions readable, in sync with the speech, not covering the face; (c) is the hook text at the start readable and correct English; (d) is there a zoom punch-in and a boom sound, does it look natural or amateur; (e) does the clip start at the beginning of a sentence and end right after the punchline; (f) is the audio level/clean; (g) is the moment actually funny or interesting (score 1-10 with a reason); (h) list concrete defects to fix." || true
          done
      - name: Keep the Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ inputs.slug }}-${{ github.run_id }}
          path: state/${{ inputs.slug }}/shorts/*.mp4
          retention-days: 14
          if-no-files-found: warn
      - name: Record
        if: always()
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          git add state/${{ inputs.slug }}/shorts/*.json 2>/dev/null; git diff --cached --quiet || { git commit -q -m "shorts: ${{ inputs.slug }}"; for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((i*2)); done; }
