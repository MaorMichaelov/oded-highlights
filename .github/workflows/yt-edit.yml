name: yt-edit
# Edits title/description of a PRIVATE draft (from the app). Never touches public videos or privacy.
on:
  workflow_dispatch:
    inputs:
      video_id: { required: true }
      title: { required: false, default: "" }
      description: { required: false, default: "" }
concurrency: { group: yt-edit, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Edit
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          VID: ${{ inputs.video_id }}
          TITLE: ${{ inputs.title }}
          DESC: ${{ inputs.description }}
        run: |
          python3 scripts/yt_edit.py "$VID" "$TITLE" "$DESC"
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          git add state/events.jsonl; git diff --cached --quiet || { git commit -q -m "app: edit draft"; git pull --rebase -q || true; git push -q || true; }
