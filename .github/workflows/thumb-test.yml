name: thumb-test
# Builds pro thumbnails from real Kick/Twitch clips (Gemini picks the face frame) and commits them to state/thumb_tests/ so they can be looked at.
on:
  workflow_dispatch:
    inputs:
      urls: { description: "space separated video/clip URLs (yt-dlp)", required: true }
      text: { description: "hook text (2-4 words)", required: false, default: "HE SAID WHAT" }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; pip install -q numpy pillow yt-dlp
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          mkdir -p state/thumb_tests w; n=0
          for u in ${{ inputs.urls }}; do n=$((n+1)); yt-dlp -q -f "best[height<=720]/best" -o "w/v$n.%(ext)s" "$u" || continue
            python3 scripts/thumb_pro.py w/v$n.* state/thumb_tests/t$n.jpg --text "${{ inputs.text }}" || true
          done
          git config user.name highlights-bot; git config user.email highlights-bot@users.noreply.github.com
          git add state/thumb_tests; git commit -qm "thumb tests" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i*2)); done
