name: thumbnail
# Generates 3 thumbnail candidates for a clip (scene WITH the streamer inside + headline) and commits them. Needs the repo secret CF_API_TOKEN (Cloudflare Workers AI).
on:
  workflow_dispatch:
    inputs:
      slug: { description: "clip id / file name", required: true }
      preset: { description: "style preset (phone_call, heist, lawsuit, courtroom_ban, airport_leave, birthday, quiz_game, rant, money, ai_tech, reaction_video, date_show, gaming_fail, sleeping_drunk, game_launch)", required: true, default: "game_launch" }
      head: { description: "headline line 1 (Hebrew)", required: true }
      accent: { description: "headline line 2 (Hebrew)", required: false, default: "" }
      refs: { description: "portrait refs (comma separated)", required: false, default: "shock,excited,smirk" }
permissions:
  contents: write
jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy opencv-python-headless rembg onnxruntime
      - name: Generate
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/make_scene_thumb.py --slug "${{ inputs.slug }}" --preset "${{ inputs.preset }}" --head "${{ inputs.head }}" --accent "${{ inputs.accent }}" --refs "${{ inputs.refs }}" --seeds 3
      - name: Commit
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          git add assets/final_thumbs assets/scenes_ai
          git commit -m "thumbnails: ${{ inputs.slug }}" || echo "nothing to commit"
          git pull --rebase -q || true; git push
