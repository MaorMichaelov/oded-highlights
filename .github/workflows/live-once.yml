name: live-once
# ONE iteration of the live clipping loop with full logs (diagnostics): does not upload, does not commit.
on:
  workflow_dispatch:
    inputs:
      slug: { required: true }
      platform: { required: false, default: "twitch" }
      window: { required: false, default: "30" }
permissions: { contents: read }
jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy yt-dlp faster-whisper "av==15.1.0"
          bash scripts/setup_workspace.sh
      - name: One iteration
        env:
          IN_SLUG: ${{ inputs.slug }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_WINDOW: ${{ inputs.window }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          rm -f "state/${IN_SLUG}/live_state.json"
          python3 -u scripts/live_shorts.py --slug "$IN_SLUG" --platform "$IN_PLATFORM" --credit "$IN_SLUG" --window "$IN_WINDOW" --long-every 0 2>&1 | tail -60
