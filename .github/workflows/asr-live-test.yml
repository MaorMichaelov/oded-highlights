name: asr-live-test
# Tests the production ingest path (live_watch.py with ivrit-ai) on a PAST VOD, in an isolated checkout. Does not commit state.
on:
  workflow_dispatch:
    inputs:
      force_vod: { default: "1" }
      start_seg: { default: "1200" }
      max_segs: { default: "30" }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-ivrit-whisper-turbo-ct2-v1 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper "av==15.1.0"
      - name: Run ingest on a past VOD
        env:
          ASR: ivrit
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_VOD: ${{ inputs.force_vod }}
          START_SEG: ${{ inputs.start_seg }}
          MAX_SEGS_PER_RUN: ${{ inputs.max_segs }}
        run: |
          /usr/bin/time -v python3 scripts/live_watch.py 2>&1 | grep -E "vod |ingested|ASR|ivrit|Elapsed|Maximum resident|engine" 
          echo "--- sample"; head -n 14 state/transcripts/*.jsonl
