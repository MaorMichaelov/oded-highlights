name: monitor
# Station 6: is the live loop alive, did renders fail, are clips stuck? Opens a GitHub issue (email) on problems and restarts the live loop if it died.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/20 * * * *"
concurrency: { group: monitor, cancel-in-progress: true }
permissions: { contents: write, actions: write, issues: write }
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          python3 scripts/stations/monitor.py || true
          git add state/health.json; git diff --cached --quiet || { git commit -q -m "state: health"; git pull --rebase -q || true; git push -q || true; }
