name: app-test
# Tests the chat app Worker from GitHub (the assistant's sandbox cannot reach workers.dev). Uses a separate test worker.
on:
  workflow_dispatch:
    inputs:
      url: { description: "worker url", required: true, default: "https://oded-app-test.odedhl.workers.dev" }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    env:   # workflow inputs go through env vars, never straight into the shell script (injection)
      IN_URL: ${{ inputs.url }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # only ever sent to a validated *.workers.dev URL
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: python3 scripts/ci_check_inputs.py
      - name: Test
        run: |
          U=${IN_URL}; PW="test-pass-12345"
          echo "home: $(curl -s -o /dev/null -w '%{http_code} %{size_download}B' $U/)"; echo "state: $(curl -s $U/api/state)"
          echo "setup: $(curl -s -X POST $U/api/setup -H 'content-type: application/json' -d "{\"password\":\"$PW\"}")"
          echo "feed-nopass: $(curl -s -o /dev/null -w '%{http_code}' $U/api/feed)"
          echo "feed: $(curl -s $U/api/feed -H "x-pass: $PW" | head -c 400)"
          for q in "איזה הפעלות של המערכת רצו לאחרונה ומה נכשל?" "כמה הודעות בצ'אט היו בחצי שעה האחרונה?" "מה מצב המערכת ומה המעקב אומר?" "איך עובדת תחנת הבחירה?" "מה הקליפ החזק ביותר ולמה לדעתך?"; do
            echo "--- Q: $q"; curl -s -m 120 -X POST $U/api/chat -H "x-pass: $PW" -H "x-groq: $GROQ_API_KEY" -H 'content-type: application/json' -d "{\"messages\":[{\"role\":\"user\",\"content\":\"$q\"}]}" | head -c 900; echo
          done
