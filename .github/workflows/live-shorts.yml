name: live-shorts
# RELEASE-DAY loop (e.g. GTA 6): while the streamer is live, every few minutes the next finished 30-minute window of the running stream becomes up to 2 Shorts (focus topic boosted), uploaded as PRIVATE drafts to the English channel (quota permitting). Self-chains every ~5h40. Stop: create state/<slug>/PAUSE.
on:
  workflow_dispatch:
    inputs:
      slug: { required: true }
      platform: { required: false, default: "kick" }
      credit: { required: false, default: "" }
      focus: { required: false, default: "" }
      upload: { required: false, default: "true" }
      max_upload: { required: false, default: "2" }
      window: { description: "minutes of stream per window", required: false, default: "12" }
      shorts_per_window: { required: false, default: "3" }
      long_every: { description: "also make a LONG video for every N finished minutes of the stream (0 = off)", required: false, default: "40" }
      force: { description: "treat the newest VOD as current even if offline (test)", required: false, default: "false" }
concurrency: { group: "live-shorts-${{ inputs.slug }}", cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  loop:
    runs-on: ubuntu-latest
    env:   # workflow inputs go through env vars, never straight into the shell script (injection)
      IN_SLUG: ${{ inputs.slug }}
      IN_PLATFORM: ${{ inputs.platform }}
      IN_CREDIT: ${{ inputs.credit }}
      IN_FOCUS: ${{ inputs.focus }}
      IN_MAX_UPLOAD: ${{ inputs.max_upload }}
      IN_LONG_EVERY: ${{ inputs.long_every }}
      IN_WINDOW: ${{ inputs.window }}
      IN_SHORTS_PER_WINDOW: ${{ inputs.shorts_per_window }}
      IN_UPLOAD: ${{ inputs.upload }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: python3 scripts/ci_check_inputs.py
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy yt-dlp faster-whisper "av==15.1.0"
          bash scripts/setup_workspace.sh
      - name: Loop
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          CHANNEL_YT: en
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          end=$((SECONDS+20400))
          while [ $SECONDS -lt $end ]; do
            [ -f "state/${IN_SLUG}/PAUSE" ] && { echo "PAUSE file present, stopping"; exit 0; }
            python3 -u scripts/live_shorts.py --slug "${IN_SLUG}" --platform "${IN_PLATFORM}" --credit "${IN_CREDIT}" --focus "${IN_FOCUS}" ${{ inputs.upload == 'true' && '--upload' || '' }} --max-upload "${IN_MAX_UPLOAD}" --long-every "${IN_LONG_EVERY}" --window "${IN_WINDOW}" --n "${IN_SHORTS_PER_WINDOW}" ${{ inputs.force == 'true' && '--force' || '' }} || echo "iteration failed (continuing)"
            for f in state/${IN_SLUG}/live_state.json state/${IN_SLUG}/long/*.json state/${IN_SLUG}/shorts/*.json; do [ -e "$f" ] && git add "$f" 2>/dev/null || true; done; git diff --cached --quiet || { git commit -q -m "live shorts: ${IN_SLUG}"; for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i*2)); done; }
            sleep 240
          done
          gh workflow run live-shorts.yml --ref main -f slug="${IN_SLUG}" -f platform="${IN_PLATFORM}" -f credit="${IN_CREDIT}" -f focus="${IN_FOCUS}" -f upload="${IN_UPLOAD}" -f max_upload="${IN_MAX_UPLOAD}" -f long_every="${IN_LONG_EVERY}" -f window="${IN_WINDOW}" -f shorts_per_window="${IN_SHORTS_PER_WINDOW}"
      - name: Keep the Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shorts-${{ inputs.slug }}-${{ github.run_id }}
          path: state/${{ inputs.slug }}/shorts/*.mp4
          retention-days: 14
          if-no-files-found: ignore
