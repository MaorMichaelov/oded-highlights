name: render-clip
# Renders a clip decided by the topic session: state/clips/<id>/{cuts.json,spec.json} -> final.mp4 -> private YouTube upload (if secrets exist).
on:
  workflow_dispatch:
    inputs:
      clip_id: { description: "folder name under state/clips", required: true }
      upload: { description: "upload to YouTube as private (needs YT secrets)", required: false, default: "true" }
      state_dir: { description: "state folder of the channel (state, state/xqc, ...)", required: false, default: "state" }
      yt: { description: "which YouTube channel: main or en", required: false, default: "main" }
      shorts: { description: "also cut vertical Shorts from the strongest moments (true/false)", required: false, default: "false" }
      thumbs: { description: "also generate auto thumbnails (slow; drafts go up without a thumbnail, the other bot makes thumbnails)", required: false, default: "false" }
concurrency: { group: "render-${{ inputs.state_dir }}-${{ inputs.clip_id }}", cancel-in-progress: false }   # different clips render in parallel
env:
  HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
  HAS_YT2: ${{ secrets.YT2_REFRESH_TOKEN != '' }}
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow numpy opencv-python-headless
          bash scripts/setup_workspace.sh
      - name: Thumbnails (2 versions A/B, optional)
        if: ${{ inputs.thumbs == 'true' }}
        env: { CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}" }
        run: |
          pip install -q rembg onnxruntime
          python3 scripts/package_clip.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}" --seeds 2 || echo "thumbnail step failed (continuing)"
      - name: "Station 3 - CUT (1080p60 download + exact trim)"
        run: python3 scripts/stations/cut.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}"
      - name: Publish progress
        if: always()
        continue-on-error: true
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          git add state/events.jsonl 2>/dev/null; git diff --cached --quiet || { git commit -q -m "events: progress"; (git pull --rebase -q && git push -q) || git rebase --abort 2>/dev/null || true; }
      - name: "Station 4 - EDIT (opening, sting, popup, quality gate)"
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: python3 scripts/stations/edit.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}"
      - name: Publish progress
        if: always()
        continue-on-error: true
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          git add state/events.jsonl 2>/dev/null; git diff --cached --quiet || { git commit -q -m "events: progress"; (git pull --rebase -q && git push -q) || git rebase --abort 2>/dev/null || true; }
      - name: "Station 7 - QUALITY gate (1080p60, > 8 Mbps, sync, dead air, loudness)"
        run: python3 scripts/stations/quality.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}"
      - name: Publish progress
        if: always()
        continue-on-error: true
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          git add state/events.jsonl 2>/dev/null; git diff --cached --quiet || { git commit -q -m "events: progress"; (git pull --rebase -q && git push -q) || git rebase --abort 2>/dev/null || true; }
      - name: "Station 5 - DRAFT (private upload)"
        if: ${{ inputs.upload == 'true' && ((inputs.yt != 'en' && env.HAS_YT == 'true') || (inputs.yt == 'en' && env.HAS_YT2 == 'true')) }}   # WORLD CLIPS (yt=en) uploads only with its own YT2_* secrets, never with the ODED HIGHLIGHTS ones
        env:
          YT_REFRESH_TOKEN: ${{ inputs.yt == 'en' && secrets.YT2_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ inputs.yt == 'en' && secrets.YT2_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ inputs.yt == 'en' && secrets.YT2_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
        run: python3 scripts/stations/draft.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}"
      - name: "Station 8 - SHORTS (vertical, from the strongest moments)"
        if: ${{ inputs.shorts == 'true' }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_REFRESH_TOKEN: ${{ inputs.yt == 'en' && secrets.YT2_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ inputs.yt == 'en' && secrets.YT2_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ inputs.yt == 'en' && secrets.YT2_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
        run: python3 scripts/stations/shorts.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}" ${{ (inputs.upload == 'true' && env.HAS_YT == 'true') && '--upload' || '' }}
      - name: "QA - Gemini watches an excerpt of the final clip"
        if: ${{ always() }}
        continue-on-error: true
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          pip install -q yt-dlp
          python3 scripts/qa_clip.py "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}" || echo "qa skipped"
      - name: Keep the rendered video (works even without YouTube secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ inputs.clip_id }}
          path: |
            ${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}/final.mp4
            ${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}/meta.json
            assets/final_thumbs/${{ inputs.clip_id }}_s*.jpg
          retention-days: 14
          if-no-files-found: warn
      - name: Record result
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          python3 scripts/stations/index.py || true
          rm -rf "${{ inputs.state_dir }}/clips/${{ inputs.clip_id }}/work"; git add state/index.json state/events.jsonl state/lessons.json 2>/dev/null; git add ${{ inputs.state_dir }}/clips assets/final_thumbs assets/scenes_ai
          git commit -m "clip rendered: ${{ inputs.clip_id }}" || echo "nothing to commit"; for i in 1 2 3 4; do git rebase --abort 2>/dev/null || true; git pull --rebase -q && git push -q && break; sleep 3; done; git status -sb | head -2
