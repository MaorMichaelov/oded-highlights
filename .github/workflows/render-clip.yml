name: render-clip
# Renders a clip decided by the topic session: state/clips/<id>/{cuts.json,spec.json} -> final.mp4 -> private YouTube upload (if secrets exist).
on:
  workflow_dispatch:
    inputs:
      clip_id: { description: "folder name under state/clips", required: true }
      upload: { description: "upload to YouTube as private (needs YT secrets)", required: false, default: "true" }
      thumbs: { description: "also generate auto thumbnails (slow; drafts go up without a thumbnail, the other bot makes thumbnails)", required: false, default: "false" }
concurrency: { group: "render-${{ inputs.clip_id }}", cancel-in-progress: false }   # different clips render in parallel
env:
  HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow numpy opencv-python-headless
          bash scripts/setup_workspace.sh
      - name: Thumbnails (2 versions A/B, optional)
        if: ${{ inputs.thumbs == 'true' }}
        env: { CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}" }
        run: |
          pip install -q rembg onnxruntime
          python3 scripts/package_clip.py "state/clips/${{ inputs.clip_id }}" --seeds 2 || echo "thumbnail step failed (continuing)"
      - name: "Station 3 - CUT (1080p60 download + exact trim)"
        run: python3 scripts/stations/cut.py "state/clips/${{ inputs.clip_id }}"
      - name: "Station 4 - EDIT (opening, sting, popup, quality gate)"
        env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
        run: python3 scripts/stations/edit.py "state/clips/${{ inputs.clip_id }}"
      - name: "Station 7 - QUALITY gate (1080p60, > 8 Mbps, sync, dead air, loudness)"
        run: python3 scripts/stations/quality.py "state/clips/${{ inputs.clip_id }}"
      - name: "Station 5 - DRAFT (private upload)"
        if: ${{ inputs.upload == 'true' && env.HAS_YT == 'true' }}
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python3 scripts/stations/draft.py "state/clips/${{ inputs.clip_id }}"
      - name: Keep the rendered video (works even without YouTube secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ inputs.clip_id }}
          path: |
            state/clips/${{ inputs.clip_id }}/final.mp4
            state/clips/${{ inputs.clip_id }}/meta.json
            assets/final_thumbs/${{ inputs.clip_id }}_s*.jpg
          retention-days: 14
          if-no-files-found: warn
      - name: Record result
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          rm -rf "state/clips/${{ inputs.clip_id }}/work"; git add state/clips assets/final_thumbs assets/scenes_ai
          git commit -m "clip rendered: ${{ inputs.clip_id }}" || echo "nothing to commit"; git pull --rebase -q || true; git push
