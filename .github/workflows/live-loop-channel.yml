name: live-loop-channel
# Same as live-loop.yml but for OTHER Kick streamers (English channel). One run per streamer; own state folder; drafts go to the YouTube channel chosen by `yt`.
# Start: gh workflow run live-loop-channel.yml -f channel=adinross -f lang=en  (the loop re-dispatches itself every ~5h40). Stop: create <state_dir>/PAUSE.
on:
  workflow_dispatch:
    inputs:
      channel: { description: "Kick slug (adinross, xqc, trainwreckstv...)", required: true }
      lang: { description: "en or he", required: false, default: "en" }
      yt: { description: "main or en (which YouTube channel gets the drafts)", required: false, default: "en" }
      credit: { description: "name shown in the description credit", required: false, default: "" }
      force_vod: { description: "TEST/backfill: index in the streamer's VOD list (0 = newest) to transcribe even when offline; empty = only the live stream", required: false, default: "" }
concurrency:
  group: live-${{ inputs.channel }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-asr-${{ inputs.lang }}-v1
      - name: Install ASR
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper "av==15.1.0"
      - name: Poll loop
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ASR: ivrit
          CHANNEL: ${{ inputs.channel }}
          ASR_LANG: ${{ inputs.lang }}
          PICK_LANG: ${{ inputs.lang }}
          CHANNEL_YT: ${{ inputs.yt }}
          CHANNEL_CREDIT: ${{ inputs.credit || inputs.channel }}
          STATE_DIR: state/${{ inputs.channel }}
          FORCE_VOD: ${{ inputs.force_vod }}
        run: |
          git config user.name "highlights-bot"; git config user.email "highlights-bot@users.noreply.github.com"
          mkdir -p "$STATE_DIR"
          end=$((SECONDS+20400))
          while [ $SECONDS -lt $end ]; do
            [ -f "$STATE_DIR/PAUSE" ] && { echo "PAUSE file present, stopping"; exit 0; }
            python3 scripts/live_watch.py || echo "live_watch failed (continuing)"
            python3 scripts/stations/live_alert.py || echo "alert failed (continuing)"
            python3 scripts/stations/pick.py || echo "pick station failed (continuing)"
            python3 scripts/stations/index.py || true
            git add state; git diff --cached --quiet || { git commit -q -m "state: ${CHANNEL} $(date -u +%FT%TZ)"; git pull --rebase -q || true; git push -q || true; }
            B=$(python3 -c 'import json,os;print(json.load(open(os.environ["STATE_DIR"]+"/ingest_state.json")).get("_behind_segs",0))' 2>/dev/null || echo 0)
            if [ "${B:-0}" -gt 12 ]; then echo "behind by $B segments: no sleep"; else sleep 300; fi
          done
          gh workflow run live-loop-channel.yml --ref main -f channel="$CHANNEL" -f lang="$ASR_LANG" -f yt="$CHANNEL_YT" -f credit="$CHANNEL_CREDIT" -f force_vod="$FORCE_VOD"
